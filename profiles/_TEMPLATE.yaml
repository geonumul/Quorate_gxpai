# ═══════════════════════════════════════════════════════════════════════════
#  사무소 프로파일 **양식** — 새 설계사무소 도면을 받으면 이 파일을 복사해서 채운다
# ═══════════════════════════════════════════════════════════════════════════
#
#  ★핵심 원칙: **코드를 고치지 않고 이 파일만 갈아 끼워서** 새 사무소를 받는다.
#
#  설계사무소마다 레이어·블록 이름이 완전히 다르다. 지금까지 본 것만:
#
#    내용고형제 (C&H ENG)  벽 `하니컴패널`·`B-WAL`  문 `DOOR`·`DOR`  방번호 `(3301)`
#    참고도면 (무균)        벽 `ARCH-기존`·`008_P__Wall 50T`  문 `DOOR`  방번호 `F2I01`
#    MAS UNIT             벽 `D-WALC`  문 `D-DOOR1`  텍스트 `D-TXTS`/`D-TXTM`
#
#  ─────────────────────────────────────────────────────────────────────────
#  ■ 채우는 순서
#
#    1) DWG → DXF:   python _에이전트작업/dwg변환/dwg2dxf.py "도면.dwg"
#    2) 자동 초안:    python scripts/onboard.py "도면.dxf" --yaml > profiles/새사무소.yaml
#    3) **눈으로 검증** ← 이 단계를 건너뛰면 반드시 당한다
#    4) 시설 등록 → ingest → 방 개수·면적이 상식적인지 확인
#
#  ■ ★자동 초안은 **틀린다.** 우리가 당한 것들:
#
#    · 벽 레이어를 이름으로 짐작(`크린판넬`) → 96개 방이 하나의 40,710㎡ 덩어리가 됐다
#    · "블록 안이 전부 레이어 0" 이라 단정 → 사실이 아니었다
#    · "51/51 성공!" → **면적을 안 봤다.** 무균 전실이 0.8㎡ 였다(사람이 못 들어간다)
#    · 화살표 방향을 회전각으로 추측 → 28개 중 9개를 거꾸로 읽었다
#    · 시트가 6장인데 **1장만** 보고 있었다 → 차압계·인터락·풍량을 통째로 놓칠 뻔했다
#
#    **개수만 세면 속는다. 값이 상식적인지 반드시 확인할 것.**
# ═══════════════════════════════════════════════════════════════════════════

profile_id: 새사무소_2026          # 파일 이름과 같게
profile_version: '1'
description: >
  (사무소 이름 / 제형 / 도면 세트 / 받은 날짜 / 담당자)

# ── 층 ─────────────────────────────────────────────────────────────────────
floors:
  '3': 3F
  '4': 4F

# ── 라벨 텍스트를 어디서 읽나 ───────────────────────────────────────────────
label_entity_types: [TEXT, MTEXT]

# ★블록 재귀가 **들어가면 안 되는** 블록 (정규식).
#   기둥 블록 안의 철골 규격(`H-350X350X12X19`)이 방 이름 레이어에 얹혀 있어
#   방 이름을 오염시킨 적이 있다(`SC2 H-350X350X12X19 갱의실(여)A`).
label_exclude_blocks: '기둥'      # 없으면 지운다

# ── 평면도 ─────────────────────────────────────────────────────────────────
floorplan:
  room_layers: []                 # 방번호·이름이 있는 레이어 (여러 개 가능)
  room_no_regex: ''               # 예: '^\((\d{4}(?:-\d+)?)\)$'  또는 '^(F\d[A-Z]\d{2})$'
  bare_no_regex: ''               # 괄호 없는 표기도 받을 때
  skip_names: []                  # 방 이름이 아닌 텍스트(범례 등)
  max_match_dist_mm: 3000         # 번호 ↔ 이름 짝짓기 반경
  name_above_max_mm: 1500
  name_above_penalty: 2.0
  multiline_merge: {max_dx_mm: 900, max_dy_mm: 600}

# ── 방 경계 (벽 flood-fill) ─────────────────────────────────────────────────
boundaries:
  # ★★벽 레이어를 **이름으로 짐작하지 말 것.** 실패한 방 주변에서 **세어라.**
  #   `scripts/onboard.py` 가 기하(길고 축에 나란한 선분)로 채점해 준다.
  #   그래도 **방 개수와 면적을 눈으로 확인**해야 한다.
  wall_layers: []
  # 레이어로 벽만 골라낼 수 없는 도면이면 ["*"] (전부 태우기).
  # ⚠ 대가: 덕트·치수선·가구까지 벽이 되어 **방이 잘게 썰린다**(면적이 반토막 난다).
  #    참고도면에서 실제로 505㎡ → 928㎡ 차이가 났다. 최후의 수단이다.
  door_layers: []                 # 문(스윙 호). 벽 구멍을 막는 데 쓴다
  skip_blocks: []                 # 방 라벨 상자처럼 벽이 아닌데 벽 레이어에 있는 블록
  seal_doors: true
  cell_mm: 60                     # 격자 한 칸
  close_gap_mm: 200               # 틈 메우기. **작게.** 크면 작은 방(전실 2~4㎡)을 삼킨다
  adj_gap_mm: 300                 # 인접 판정용(벽 두께를 건너뛴다). close_gap 과 **분리**
  min_area_m2: 0.5
  max_area_m2: 400                # 초과 = 벽이 안 닫힘 → 버린다(조용히 틀린 값보다 낫다)

# ── 청정등급 ───────────────────────────────────────────────────────────────
# ⚠ 도면에 등급 표기가 **없을 수 있다**(내용고형제는 0건이었다).
#    없으면 등급 규칙 5개가 **판정 불가**다. 발주처에 요청할 것.
grades:
  layers: []                      # (A) (B) (C) (D) CNC NC 가 적힌 레이어

# ── 절대압력 (25Pa 꼴) ─────────────────────────────────────────────────────
pressure_value:
  layers: []
  max_match_dist_mm: 5000
  above_penalty: 2.0

# ── 차압도 (방번호 + 차압 화살표) ───────────────────────────────────────────
pressure:
  rm_layer: ''                    # 차압도의 방번호 레이어
  # room_no_regex: ''             # 평면도와 표기가 다르면 여기서 덮어쓴다
  title_layers: []
  floor_regex: '(\d)층'
  name_match_dist_mm: 3000
  multiline_merge: {max_dx_mm: 900, max_dy_mm: 600}
  # ★화살표: 레이어 이름이 곧 **차압 설정값**인 경우가 있다
  #   (`Air Flow 10Pa` / `Air Flow 15Pa` / `Air Flow no차압`).
  #   그러면 도면이 구간별 목표 차압을 직접 말해 주는 것이다 — 반드시 쓸 것.
  arrow_layers: []
  arrow_block_prefix: ''          # 레이어로 못 고를 때만
  ta_layer: ''
  ta_unit: UNKNOWN                # ★확정 전까지 어떤 규칙도 이 값을 쓰지 않는다

# ── 차압계 (별표1 4-너: 청정실 경계에 설치 의무) ─────────────────────────────
# ⚠ **다른 시트**에 있을 수 있다. 시트가 여러 장이면 전부 열어볼 것.
gauge:
  layers: []                      # 예: [차압계-아날로그, 차압계-디지털]

# ── 인터락 (별표1 4-파: A·B 연결 에어락은 인터락 필수) ───────────────────────
interlock:
  layers: []                      # 예: [u-interlock]  — 두 문을 잇는 2점 선

# ── 급기 풍량 ──────────────────────────────────────────────────────────────
# ⚠★환기 횟수(ACH) **규칙은 만들지 않는다.** 현행 고시에 수치가 없다
#    (구 KGMP 해설서에만 있다). 데이터로만 적재한다.
airflow:
  layers: []
  unit: UNKNOWN                   # 도면이 명시하면 확정(예: B-ZONE 의 '풍량(CMH)')
  unit_source: ''

# ── 압력 유형 (regime) ─────────────────────────────────────────────────────
# 이름으로 추정한다. 틀리면 방번호로 덮어쓴다.
#   protect(보호·고압) / contain(봉쇄·저압, 분진) / hazard(음압, 특수) / neutral
pressure_regime:
  overrides: {}                   # 예: {"3117": contain}

grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}

# ── 장비·공조·설계개요 (선택) ───────────────────────────────────────────────
equipment: {layers: []}
hvac: {layers: []}
overview: {layers: []}
