# osd_hs_2025.yaml - 내용고형제(OSD) 시설 프로파일
# v0.1 스크립트에 하드코딩돼 있던 상수를 전부 이곳으로 이관 (T1.1.2).
# 신규 시설은 이 파일을 복제·수정만 하면 코드 수정 0줄로 처리된다.
profile_id: osd_hs_2025
profile_version: "1"
description: "경구고형제(OSD) 증축 도면 세트. 방번호 4자리 + (####) 앵커 패턴."

# 방번호 첫자리 → 층
floors:
  "1": 1F
  "2": 2F
  "3": 3F
  "4": 4F

label_entity_types: [TEXT, MTEXT]       # R-A2: TEXT+MTEXT 모두 순회

floorplan:
  room_layers: [TEX, TMP_TXT, "11"]     # 방이름/번호 TEXT 레이어
  room_no_regex: '^\((\d{4}(?:-\d+)?)\)$'   # (3301), (3501-1)
  bare_no_regex: '^\d{4}(?:-\d+)?$'
  max_match_dist_mm: 6000               # 번호-이름 매칭 상한
  name_above_max_mm: 2500               # 이름은 번호 바로 위 관례
  name_above_penalty: 1500
  skip_names: [UP, DN, PD/AV, PD, AV, EPS, TPS]
  title_attrib_tag: "도면명"
  multiline_merge:                      # S-3: 평면도에도 여러 줄 이름 병합 적용
    max_dy_mm: 800
    max_dx_mm: 1200

pressure:
  rm_layer: RM                          # 방번호+이름
  ta_layer: TA                          # 수치 (단위 미확정 - question 참조)
  title_layers: [TIT, TXT]
  floor_regex: '(\d)(?:rd|th|st|nd)\s+FLOOR'
  arrow_block_prefix: "A$"              # 익명블록 차압 화살표 (rotation=방향)
  ref_pressure_token: "Pa"
  name_match_dist_mm: 3000
  multiline_merge:                      # 2줄로 쪼개진 이름 병합
    max_dy_mm: 800
    max_dx_mm: 1200
  ta_unit: UNKNOWN                      # CMH(급기량) vs Pa(차압) - 발주처 확인 필요 (question)

hvac:
  ahu_layer_prefix: "AHU"               # AHU-101 등 레이어명으로 배치 (인벤토리 확인됨)
  ahu_tag_regex: 'AHU[-\s]?\w+'         # 'AHU-203 SA' 같은 텍스트 태그

equipment:
  layers: ["장비"]                       # 평면도·HVAC 공통 장비 레이어 (인벤토리 확인됨)

overview:                                # 설계개요 표 → facility 메타 (T1.2.2)
  row_dy_mm: 300                         # 같은 행 판정 y 밴드
  value_max_dx_mm: 12000                 # 키워드 오른쪽 값 탐색 상한
  keywords:                              # 사전 항목만 추출 (자간 공백은 제거 후 매칭)
    - 공사명
    - 위치
    - 대지면적
    - 건축면적
    - 연면적
    - 건폐율
    - 용적률
    - 구조
    - 규모
    - 주용도
    - 지역지구
    - 용도지역

grades:
  # hatch_color_to_grade: {}            # Grade DXF 미수령 - T1.2.4 스켈레톤, question 등록됨
  status: pending_data

# ★블록 재귀(iter_label_texts)가 들어가면 안 되는 블록.
#   `SC2(기둥)` `SC3[기둥]` 안에는 철골 규격(`H-350X350X12X19`)이 들어 있고,
#   하필 그 텍스트가 방 이름 레이어(TMP_TXT)에 얹혀 있다.
#   막지 않으면 방 4107 의 이름이 통째로 'SC2 H-350X350X12X19' 가 되고,
#   방 3205 는 'SC2 H-350X350X12X19 갱의실(여)A' 로 이름 앞에 규격이 붙는다.
label_exclude_blocks: "기둥"

boundaries:
  # ★벽 레이어는 **이름으로 짐작하지 않았다. 방 주변에서 세었다.**
  #   처음엔 `크린판넬` 로 짐작했다가 96방이 전부 하나의 40,710㎡ 덩어리가 됐다
  #   (그 레이어는 방 라벨이 없는 **다른 시트**의 것이었다).
  #   실패한 방 반경 6m 안의 '축에 나란한 긴 선분'을 레이어별로 세어 찾았다.
  #   → `하니컴패널`(클린룸 벽체)이 본체, `B-WAL` 이 건축 벽.
  #
  # ★그런데 진짜 원인은 레이어가 아니었다: **벽 선분이 블록 안에 있었다.**
  #   블록 재귀를 켜기 전엔 3층 37방 중 32방이 하나의 41,227㎡ 덩어리였다.
  #   "벽이 안 그려져 있다"고 오진하고 문 막기·레이어 추가로 39/94 까지 겨우 올렸는데,
  #   블록 재귀 한 줄로 **79/94** 가 됐다(3F 5→27 · 4F 34→52).
  #   교훈: CAD 에서 "없다"고 결론 내리기 전에 **블록 안을 봤는지** 먼저 확인하라.
  wall_layers:
    - 하니컴패널          # 클린룸 벽체(허니컴 패널). 본체
    - B-WAL              # 건축 벽
    - 계단실
    - COL
    - 일반철골조(기둥)
    - 창호
    - WIN-1
    - 크린판넬
    - 판넬
    - GW PANEL
    - 스테인레스 칸막이벽
  door_layers: [DOR, DOOR, DOOR-HID, "DOOR(HIDDEN)"]
  # 문 막기: 문 블록의 호(문이 열리는 궤적)에서 '닫힌 위치'를 구해 벽 구멍을 막는다.
  # 이 도면에선 벽 재귀를 켜고 나니 **효과가 0** 이었다(문틀 선분이 이미 벽 레이어에 있었다).
  # 그래도 켜 둔다 — 문틀을 안 그리는 도면이 오면 그때 살아난다. 해는 없다.
  seal_doors: true
  cell_mm: 60
  close_gap_mm: 200      # 작게. 크게 하면 작은 방(전실 2~4㎡)을 삼킨다
  adj_gap_mm: 300        # 인접 판정용(벽 두께를 건너뛴다). close_gap 과 분리
  min_area_m2: 0.5
  max_area_m2: 400       # 초과 = 벽이 안 닫힘 → 버린다(조용히 틀린 값보다 '못 구했다'가 낫다)

# ═══════════════════════════════════════════════════════════════════════════
#  청정등급 — **도면에 없는 것이 정상이다**
#
#  1차 미팅(2026-07-09) 대표님:
#    Q "그럼 이게 방별로 그레이드 등급이 매겨져 있는 거요?"
#    A "**방별로는 안 하고** … 아까 그 **구역** 말씀"
#    Q "그럼 그런 건 따로 적혀 있지는 않은 거예요?"
#    A "**그렇죠.** 이제 그건 **나중에**, 이 방을 1·2·3·4로 가든 a·b·c로 하든 쫙 해놓고
#       '**a부터 b는 그레이드 B, d부터 f까지는 그레이드 C**' 이렇게 해주면
#       [AI]가 알아서 그렇게 가게끔 해야죠."
#
#  → 등급은 **사람이 구역으로 묶어 지정**한다. 도면에 등급 표기가 0건인 건 결함이 아니다.
#    (나는 이걸 '도면 결함·최대 병목'이라고 잘못 써왔다)
# ═══════════════════════════════════════════════════════════════════════════

# 제형이 **기본 등급**을 정한다 (같은 미팅)
#   내용고형제(알약·캡슐) → D  ·  액제·연고·크림 → C  ·  주사제 → B 이상
product_type: 내용고형제
# default_grade: D              # 안 쓰면 product_type 에서 자동으로 온다

# ★구역 지정 — **발주처/설계사가 채워야 하는 칸.** 비어 있으면 제형 기본값만 적용된다.
#   방번호 목록 또는 범위로 쓴다:
#     grade_zones:
#       C: [{from: '4401', to: '4409'}]     # 과립·타정 구역을 C 로
#       D: [{from: '4601', to: '4606'}]
#       NC: ['4111', '4112']                # 휴게실 등 관리 제외
grade_zones: {}
