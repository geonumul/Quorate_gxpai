# ref_2f_2026.yaml - 새 참고도면(다른 시설 2층) 프로파일
#
# 왜 이 시설을 등록하나
#   기준 시설(내용고형제)에는 **등급도 절대압력도 도면에 없다.**
#   그래서 PRES-001/002 · ADJ-001 을 실제 데이터로 검증할 방법이 없었다.
#   이 도면에는 **등급 49 · 절대압력 45 · 화살표 39** 가 다 있다.
#   → 규칙이 진짜 도는지 여기서 검증하고, 그 방법을 기준 시설로 가져간다.
#
# 도면 구조 (기준 시설과 크게 다르다 — 프로파일만으로 흡수되는지가 시험대다)
#   - 원본은 한 DXF 에 **6장이 나란히** 있다 → scripts/cut_ref_sheet.py 로 시트를 잘라 씀
#   - 방 라벨이 **블록 안**에 있다(3단 중첩) → ingest/dxftext.py 의 블록 재귀가 처리
#   - 라벨 블록 구조: [등급 / 이름 / 방번호 / 절대압력] 세로 4단
profile_id: ref_2f_2026
profile_version: "1"
description: "참고도면 2층(무균+고형 혼재). 등급·절대압력·화살표가 모두 표기된 시설."

# 방번호 첫자리 → 층. 이 도면은 F2I01 / F2P03 / F2G01 형식이라 숫자 층 매핑이 안 통한다.
# floor_from_number 가 못 풀면 None 이 되고, 그러면 층 구분 없이 동작한다(문제 없음).
floors:
  "2": 2F

label_entity_types: [TEXT, MTEXT]

floorplan:
  # 블록 안의 레이어들. iter_label_texts 가 블록을 재귀로 내려가 읽는다.
  room_layers: [ROOMNUMBER, RoomName]
  room_no_regex: '^(F\d[A-Z]\d{2})$'      # F2I01, F2P03, F2G01
  bare_no_regex: '^\d{4}$'                # 2001, 2029 (기존 구역)
  max_match_dist_mm: 4000
  name_above_max_mm: 2000                 # 이름은 번호 바로 위
  name_above_penalty: 1000
  skip_names: [UP, DN, SOB, "S.O.B", C/P, P.S, PS]
  title_attrib_tag: "도면명"
  multiline_merge:
    max_dy_mm: 600
    max_dx_mm: 900

grades:
  # ★해치 색상이 아니라 **텍스트 라벨** `(D)` `(C)` `(B)` `(CNC)` `(NC)`
  layers: [Grade]
  max_match_dist_mm: 4000
  below_penalty: 2.0        # 등급은 방번호 '위'에 있다. 아래쪽 등급엔 벌점

pressure_value:
  # 절대 정압. `25Pa` `0Pa`. TA(풍량)와 헷갈리면 안 되므로 정규식이 `Pa` 접미를 요구한다.
  layers: [차압]
  max_match_dist_mm: 5000
  above_penalty: 2.0        # 압력은 방번호 '아래'가 기본. 좁으면 위로 밀린다(F2I08)

pressure:
  # 차압도 전용 라벨(기준 시설의 RM/TA 에 해당). 이 도면은 평면도와 차압도가 한 장이라
  # 같은 레이어를 쓴다.
  rm_layer: ROOMNUMBER
  ta_layer: 풍량            # 이송 공기량(CMH). 압력이 아니다.
  ta_unit: CMH             # ★기준 시설과 달리 여기선 확정이다(도면 범례에 CMH 명시)
  title_layers: [TEXT]
  floor_regex: '(\d)층'
  ref_pressure_token: "Pa"
  name_match_dist_mm: 3000
  multiline_merge:
    max_dy_mm: 600
    max_dx_mm: 900
  # ★화살표가 **레이어로 종류까지 구분**돼 있다(도면 범례 3종과 일치):
  #     Air Flow 10Pa   (25) - 등급이 다른 구간 (범례: 10~15Pa)
  #     Air Flow 15Pa   (13) - 동일 등급 구간   (범례: 5~10Pa)
  #     Air Flow no차압 ( 1) - 차압계 불필요
  #   회전각(0/90/180/270)이 방향이다. 래스터 추측이 필요 없다.
  arrow_layers: ["Air Flow 10Pa", "Air Flow 15Pa", "Air Flow no차압"]
  arrow_block_prefix: ""    # 블록 이름이 아니라 레이어로 고른다

boundaries:
  # 벽은 평면도 블록 안에 있다(3단 중첩, 전부 레이어 '0' → INSERT 레이어 상속).
  # ★방 라벨의 **네모 박스 블록**은 장벽에서 빼야 한다. 안 그러면 fill 이 라벨 안에 갇힌다.
  # ★벽 레이어 — **두 번 틀렸다. 두 번째는 "성공"인 줄 알고 있었다.**
  #
  #   ① `ARCH-변경` 만 지정 → 벽 선분 0개, 방 51개 전부 실패.
  #      (블록 안 엔티티의 실효 레이어를 안 봤다)
  #   ② `["*"]`(전부 태우기)로 바꿔 **51/51** 을 얻고 성공이라 불렀다. **아니었다.**
  #      면적 합계가 **505㎡** 뿐이었다 — 무균 전실 0.8㎡ · 무균 갱의실 1.2㎡.
  #      `return`(덕트)·`DIM`(치수선)·`차압`(화살표)까지 벽으로 태워 **방을 잘게 썰고 있었다.**
  #      **"51/51" 은 '숫자가 나왔다'였지 '숫자가 맞다'가 아니었다.**
  #      → 면적이 상식적인지 **반드시 확인할 것.** 개수만 세면 속는다.
  #
  #   ③ 지금: 블록 안의 **실효 레이어**를 전수조사해서 진짜 벽을 찾았다.
  #      면적 합계 505 → **928㎡**. 바이알 충진및동결건조실 33 → 72㎡.
  #      그리고 이 도면에는 **`DOOR` 레이어가 있었다**(784 선분).
  #      "참고도면엔 문이 없다"고 했던 것도 틀렸다 — 블록 안을 안 봤을 뿐이다.
  #
  #   ⚠ 남은 한계: `ARCH-기존` 에는 벽과 **가구가 섞여 있다**(레이어가 하나뿐이라 못 가른다).
  #     가구가 방을 조금 깎을 수 있다. 면적은 **하한선**으로 보는 것이 안전하다.
  wall_layers: ["ARCH-기존", "ARCH-변경", "008_P__Wall 50T"]
  door_layers: ["DOOR"]
  skip_blocks: ["B20260107094054"]  # 방 라벨 박스 (51개 × 5선)
  cell_mm: 60
  close_gap_mm: 200                 # 작게. 크면 작은 방(전실 2~4㎡)을 삼킨다
  adj_gap_mm: 300                   # 건너뛸 벽 두께(반경). close_gap 과 분리
  min_area_m2: 0.8
  max_area_m2: 400

pressure_regime:
  # 이름 추론이 틀릴 때 방번호로 덮어쓴다. (regime_source='profile' 로 감사에 남는다)
  overrides: {}

grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}

equipment:
  layers: []          # 이 시트에는 장비가 없다

hvac:
  # ★`ahu_layers: []` 라고 적혀 있었다 — **완전히 죽은 키다.**
  #   hvac 추출기는 `ahu_layer_prefix` 와 `ahu_tag_regex` 만 읽는다.
  #   이걸로 AHU 추출을 껐다고 믿었지만 **아무 일도 일어나지 않았다** —
  #   추출기는 기본 접두사 'AHU' 로 그냥 돌고 있었다. 예외도 경고도 0건도 없었다.
  #   (tests/test_profile_no_dead_keys.py 가 이제 이런 키를 잡는다)
  #
  #   이 시트에는 AHU 가 없다. 기본 접두사로 돌려도 0건이라 문제되지 않는다.
  ahu_layer_prefix: "AHU"

overview:
  enabled: false

# ★블록 재귀(iter_label_texts)가 들어가면 안 되는 블록.
#   `SC2(기둥)` `SC3[기둥]` 안에는 철골 규격(`H-350X350X12X19`)이 들어 있고,
#   하필 그 텍스트가 방 이름 레이어(TMP_TXT)에 얹혀 있다.
#   막지 않으면 방 4107 의 이름이 통째로 'SC2 H-350X350X12X19' 가 되고,
#   방 3205 는 'SC2 H-350X350X12X19 갱의실(여)A' 로 이름 앞에 규격이 붙는다.
label_exclude_blocks: "기둥"

# ★차압계 배치도 (별표1 제4호 너목: "청정실 및 … 주변구역 사이에 차압계가 설치되어야 한다")
#   이 도면은 **다른 시트**(3번)에 있다. 우리는 시트 2(차압흐름도)만 보고 있어서
#   차압계 28개를 통째로 못 보고 있었다.
#   → scripts/cut_ref_sheet_aligned.py 로 **기준 시트 좌표계로 옮겨** 잘라 둔다.
#     정렬이 맞았는지는 좌표 범위가 겹치는지로 확인한다(차압계 x 298k~309k / 방 x 297k~335k ✔).
gauge:
  layers:
    - 차압계-아날로그
    - 차압계-디지털

# ★인터락 배치도 (별표1 제4호 파목: A·B 등급으로 연결되는 에어락은 **인터락 시스템** 필수)
#   시트 5번. 레이어 `u-interlock` 의 **2점 선** 24개 = 에어락의 두 문을 잇는 연결선.
#   ⚠ 구판(식약처 게시판)은 '인터락 **또는** 경보장치'로 뭉뚱그렸다. 현행은 등급별로 갈라놨다.
#     구판을 인용했으면 A/B 의 인터락 의무를 놓쳤을 것이다.
interlock:
  layers:
    - u-interlock

# ★급기 풍량 — **단위가 도면에 적혀 있다** (천정기구배치도 레이어 B-ZONE 의 '풍량(CMH)').
#   TA 단위는 오래 '보류'였는데 도면 스스로 확정해 줬다.
#
# ⚠★환기 횟수(ACH) 규칙은 **만들지 않는다.**
#   수치(A 600회/hr · B 20회/hr)는 「GMP 조사평가 매뉴얼」이 인용한 **구 KGMP 해설서**에만 있다.
#   **현행 고시(별표1, 2023 개정)에는 환기 횟수 수치가 없다** — 오염관리전략(CCS)으로 입증하게 한다.
#   수치를 박아 넣으면 근거 없는 관행을 법인 것처럼 판정하는 것이다.
#   → 풍량은 데이터로만 적재한다. 규칙은 ①발주처 자사 환기 기준 ②천장고 가 오면 만든다.
airflow:
  layers: [풍량]
  unit: CMH
  unit_source: "도면 표기 (천정기구배치도 B-ZONE: '풍량(CMH)')"

# ★제형 — **규칙의 적용 범위를 가른다.**
#   별표1(무균) 조문으로 완제(별표17) 시설을 판정하면 안 된다. 반대도 마찬가지다.
#   이 도면은 **바이알 충진·동결건조** 가 있는 **무균 주사제** 시설이다.
#   (방 이름: 바이알 충진및동결건조실 · 무균 조제실 · 바이알 캡핑실 · 무균 복도 …)
product_type: 무균주사제
