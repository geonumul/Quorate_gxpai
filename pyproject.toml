[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gxpai-engine"
version = "0.1.0"
description = "GXPAI — GMP 도면 자동화 엔진 (다중 시설 ingestion → 온톨로지 → violations → 생성)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "geonumul" }]
dependencies = [
    "ezdxf>=1.3",       # DXF 파싱/출력
    "shapely>=2.0",     # 방 경계 폴리곤 / 인접
    "pyyaml>=6.0",      # 프로파일·규칙 로딩
    "psycopg[binary]>=3.1",  # PostgreSQL
    "neo4j>=5.0",       # 온톨로지 그래프
    "ortools>=9.8",     # CSP 배치 (Stage 3)
    "jsonschema>=4.0",  # 프로파일/스펙 스키마 검증
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
gxpai = "gxpai.cli:main"

[tool.setuptools.packages.find]
include = ["gxpai*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
