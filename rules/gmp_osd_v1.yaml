# gmp_osd_v1.yaml - GMP OSD violations 규칙 v1 (T2.3.1)
# 규칙 = 데이터. 코드 배포 없이 규칙 추가 가능.
#
# 근거 추적성(RASE, Hjelseth & Nisbet 2011): 각 규칙을 4연산자로 분해해 "무엇을 왜 검사하는지"를
# 규정 조항까지 역추적할 수 있게 한다. auditability 는 GMP 규제의 핵심 가치(선행연구 공통 결론).
#   requirement  : 만족돼야 하는 것(shall/must)
#   applicability: 적용 대상/조건(범위 좁힘)
#   selection    : 대체 대상(범위 넓힘)
#   exception    : 예외(unless, 배제)
#
# review = 동결 게이트(GEN-R2, 규칙 오류가 생성 보상을 오염시키지 않게):
#   internal   = 내부 정합성 검사(GMP 조항 아님) - 활성 안전, 생성 보상 사용 가능
#   unreviewed = GMP 조항 기반이나 컨설턴트 미검수 - 게이트로 잠금, 생성 보상 사용 금지
#   approved   = 컨설턴트 검수 완료 - 활성/보상 사용 가능
# clause 의 조항번호·잠정 파라미터는 컨설턴트 검수 전까지 확정 아님(보류).
version: "1"
ruleset: gmp_osd_v1

rules:
  # ─────────────────────────────────────────────────────────────────────
  # 압력 규칙 3종 (2026-07-13 전면 재설계)
  #
  # ★압력 방향에는 세 가지 유형이 있고, 하나로 묶으면 안 된다.
  #   ① protect(보호)  실이 고압 — 무균제제·일반 청정실          → PRES-001
  #   ② contain(봉쇄)  실이 저압, 복도가 고압 — 분진 발생 공정   → PRES-003
  #   ③ hazard(특수)   실이 음압 — 페니실린·세포독성            → PRES-003
  #   **우리 기준 시설(내용고형제)은 ②번이다.** ①만 검사하면 전부 거짓 위반이 난다.
  #   근거: 2010 시설기준 안내서 p.24 그림6 · p.60 / 1차 미팅 / 법규/조문근거_색인.md A-4·A-5
  #
  # 화살표 의미(S-1)는 **확정됨**: 화살촉 = 저압 쪽 = 공기가 흘러가는 방향.
  #   ①1차 미팅 ②새 참고도면 범례 ③절대압력(Pa) 대조 ④DXF 회전각(0/90/180/270) — 4중 확인.
  # ─────────────────────────────────────────────────────────────────────

  - id: PRES-001
    severity: critical
    title: "압력 캐스케이드 역전 (보호형 실)"
    desc: "보호형(무균·청정) 실끼리, 더 깨끗한 방이 인접 방보다 저압이면 위반"
    clause: "식약처고시 제2024-87호 별표1 제4호 하목 / 2010 시설기준 안내서 p.23 (Cascade)"
    review: unreviewed
    rase:
      requirement: "보호(protect)형 실 사이에서는 청정도가 높은 방이 더 고압이어야 한다"
      applicability: "차압 관계가 확정되고 **양쪽 모두 protect 형**인 인접 실 쌍"
      selection: "-"
      exception: "봉쇄(contain)·특수(hazard)·중립(neutral) 실이 끼면 제외 → PRES-003 이 본다.
                  옥외·계단실·샤프트 등 압력관리 대상 아닌 공간도 제외"
    status: draft
    # 게이트 사유가 바뀌었다: 화살표 의미는 해결됨.
    # 남은 것 = grade_rank·regime 판정의 **컨설턴트 검수**, 그리고 Grade 데이터 적재.
    config:
      enabled: false
      # ★★적용 제형: **무균(별표1)만.** 완제(별표17)에는 청정등급 조문 자체가 없다
      #   (코퍼스 전수 검색: 별표17에 '청정등급' 0건).
      #   완제 시설(내용고형제)에 이 규칙을 들이대면 **조문에 없는 의무**를 만들어내는 것이다.
      applies_to: [sterile]
      cleaner_should_be: higher
      grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}   # 클수록 깨끗
      # regime_overrides: {"3117": contain}   # 이름 추론이 틀릴 때 방번호로 덮어쓴다

  - id: PRES-002
    severity: major
    title: "차압 기준값 이탈"
    desc: "인접 실의 차압이 **발주처 사내 기준서** 범위를 벗어남"
    clause: "「의약품 등의 안전에 관한 규칙」[별표1] 2.3 환경관리 나 (설정·유지 의무)
             / 식약처 현장감시 지적사례: '자사 기준서에 정해진 기준에 맞게 유지하지 아니함'"
    review: unreviewed
    rase:
      requirement: "차압은 **발주처가 정한 사내 기준서 범위** 안에 있어야 한다"
      applicability: "청정등급이 부여되고 절대압력(Pa)이 표기된 인접 실 쌍"
      selection: "기준서가 아예 없으면 '차압 기준 미설정' 자체가 위반"
      exception: "압력관리 대상이 아닌 공간(보관소·기계실 등)은 제외"
    status: draft
    # ★법정 수치로 판정하지 않는다. 실사관은 '자사 기준을 지켰나'를 본다.
    #   "10Pa 미만이니 위반"은 법적으로 틀린 판정이다.
    #   아래 값은 **새 참고도면 범례에서 읽은 그 시설의 사내 기준**이다(발주처 확인 필요).
    #   ⚠ 10~15Pa 은 2018년판까지의 국제 문구다. 2023년 개정에서 상한 15 가 삭제됐다.
    config:
      enabled: false
      # ★적용 제형: **무관.** 근거가 「의약품 등의 안전에 관한 규칙」 별표1 2.3-나 라
      #   모든 의약품 제조소에 적용된다. 우리 규칙 중 **가장 근거가 깨끗한 것**이다.
      applies_to: [any]
      # ★★폴백 수치를 **지웠다.**
      #   `diff_grade_pa: [10, 15]` 를 "사내 기준"이라 달아 뒀는데, 이 값은
      #   **구판 별표1(인용금지)의 "10~15파스칼(참고치) 정도"와 문자 그대로 같다.**
      #   현행은 상한 15가 삭제된 "**최소 10파스칼 이상**"이다.
      #   → 발주처 자사 기준서가 오기 전에는 **폴백하지 않는다.**
      #     도면에 설정값(`Air Flow 15Pa`)이 있으면 그것으로 판정하고, 없으면 판정하지 않는다.
      #     (그동안 이 값이 "사내 기준" 행세를 하며 구판 수치로 판정할 뻔했다)
      # diff_grade_pa: [10, 15]    # ← 발주처 자사 기준서가 오면 채운다
      # same_grade_pa: [5, 10]     # ← 발주처 자사 기준서가 오면 채운다
      statutory_min_pa: 10         # 고시 별표1 참고치 — 미달 시 '경고'(위반 아님)
      # ★도면이 구간별 목표 차압을 직접 적어두면(화살표 레이어 'Air Flow 15Pa') **그것이 기준**이다.
      #   위 등급별 범위는 도면에 설정값이 없을 때만 쓰는 폴백이다.
      #   설계사가 지정한 값 = 사실상의 자사 기준. 짐작보다 도면이 우선한다.
      setpoint_tolerance_pa: 5     # 도면 설정값 대비 허용오차(Pa). 표기·반올림 관행 흡수

  - id: PRES-003
    severity: critical
    title: "봉쇄 실패 (분진·특수제제 실이 복도보다 고압)"
    desc: "분진 발생실·특수제제실이 인접 복도보다 고압이면 분진이 복도로 확산됨"
    clause: "★★조문을 **교체했다** (2026-07-14 전수 감사).
             예전 근거 3개가 전부 무너졌다:
               ① 2010 안내서 p.24/p.33 → **안내서는 법이 아니다.** 게다가 그 PDF 는
                  스캔본이라 텍스트가 없어 **코퍼스에서 원문 재확인조차 안 된다**
                  ('30Pa'·'그림6'·'국소집진' 검색 전부 0건)
               ② 시설기준령 시행규칙 제5조 → 실제 조문은 **페니실린·세팔로스포린·
                  카바페넴·모노박탐·성호르몬·세포독성항암제 작업소** 시설기준이다.
                  시행규칙 전문에 '분진' **0건**. hazard(음압) 조문이지 일반 분진실 조문이 아니다.
             → 근거 없이 critical 을 내고 있었다.

             **진짜 조문 (완제의약품 · 우리 시설에 정확히 맞는다):**
             식약처고시 별표17 제3.3호 **카목** —
               '검체채취, **칭량, 혼합, 건조** 제품 포장 등과 같이 **분진이 발생하는 경우에는
                교차오염을 피하고** 청소를 용이하게 할 수 있는 **특정 조치를 취하여야 한다**'
             같은 별표17 제3.3호 **차목** —
               '일반적으로 출발물질의 칭량은 칭량 목적으로 설계한 **별도의 칭량실**에서 실시'
             같은 별표17 제3.3호 다목 하위 —
               '특정 구역 내의 공기로 인한 잠재적 오염을 차단하기 위한 **에어락 및 차압의 적절한 사용**'"
    review: unreviewed
    rase:
      requirement: "분진 발생실·특수제제실은 인접 복도보다 **저압**이어야 한다(봉쇄)"
      applicability: "regime 이 contain 또는 hazard 인 실과, 그에 인접한 복도"
      selection: "화살표(작업실→복도) 또는 절대압력(실 Pa > 복도 Pa) 중 하나만 걸려도 보고"
      exception: "폐쇄식 설비(isolator 등)로 오염 우려가 없는 경우
                  (2010 안내서 p.21 — 이때는 구획·차압 요구가 완화된다)"
    status: draft
    # ★우리 기준 시설(내용고형제)에 실제로 적용되는 압력 규칙이 이것이다.
    #   ⚠ 다만 조문이 "**특정 조치**를 취하여야 한다"는 **서술형**이다.
    #     "그 조치 = 작업실을 복도보다 저압으로 둔다"는 **우리 해석**이다.
    #     → 컨설턴트 검수 대상. 보류.
    config:
      enabled: false
      applies_to: [finished, sterile]   # 별표17(완제). 무균에도 분진 공정이 있으면 적용
      # regime_overrides: {"3117": contain}

  - id: PRES-004
    severity: major
    title: "도면 내부 모순 (화살표 방향 ↔ 절대압력)"
    desc: "차압 화살표는 A→B 로 공기가 흐른다는데, 적힌 압력은 A < B 다. 공기는 낮은 데로만 흐른다"
    clause: "법 위반이 아니라 **도면 품질** 문제다. 다만 차압 설정·유지·기록 의무
             (「의약품 등의 안전에 관한 규칙」 별표1 2.3 환경관리 나)와 이어질 수 있다 — 해석 보류"
    review: unreviewed
    rase:
      requirement: "도면의 두 근거(화살표 방향 / 절대압력 수치)는 서로 일치해야 한다"
      applicability: "방 귀속이 확정되고 **양쪽 모두 절대압력이 표기된** 차압 화살표"
      selection: "꼬리쪽 Pa < 화살촉쪽 Pa 이면 모순"
      exception: "동압(Δ0Pa)은 판단 불가 — 보고하지 않는다"
    status: draft
    # ★이 규칙은 **엔진의 자기 점검**을 겸한다.
    #   참고도면 2층에서 처음 돌렸을 때 화살표 28개 중 9개가 모순이었는데 **전부 우리 버그**였다
    #   (블록별 화살촉 방향 가정 오류 5 + 방 귀속 시 측면거리 무시 4). 고치니 31개 중 1개만 남았다.
    #   → 모순이 갑자기 늘면 도면을 의심하기 전에 **우리 추출부터 의심하라.**
    config:
      enabled: false

  - id: PRES-005
    severity: major
    title: "청정실 경계에 차압계가 없다"
    desc: "차압이 **설정**된 구간인데 **차압계가 없다** — 설정만 하고 재지 않으면 유지·기록할 수 없다"
    clause: "식약처고시 제2024-87호 별표1 제4호 너목 —
             '청정실 및 필요한 경우 아이솔레이터와 주변구역 사이에 **차압계가 설치되어야 한다**.
              … 중요하다고 확인된 차압은 **연속적으로 모니터하고 기록**하여야 한다'
             (법제처 HWP · 고시 XML · 식약처 PDF 대조 확인)"
    review: unreviewed
    rase:
      requirement: "청정실과 주변구역 사이에는 차압계가 설치되어야 한다"
      applicability: "차압이 설정된 구간(화살표 레이어에 10Pa/15Pa) 중
                      **한쪽 이상이 청정실(등급 D 이상)** 인 것"
      selection: "-"
      exception: "도면이 'Air Flow no차압'(차압계 설치가 요구되지 않는 위치, 범례 3번)으로
                  표시한 구간은 대상이 아니다.
                  CNC·NC 끼리(탈의실·갱의실 등)는 조문이 말하는 '청정실'이 아니다"
    status: draft
    # ★★범위를 좁히지 않으면 **거짓 위반 6건**이 난다 (실제로 그럴 뻔했다).
    #   차압 설정 구간 31개 중 차압계가 없는 6개를 찾았는데, 파 보니 **전부 CNC↔NC** 였다 —
    #   탈의실·갱의실·전실(갱의 체인 입구)이다. 조문은 '**청정실** 및 … 주변구역 사이'라 한다.
    #   → 한쪽 이상이 D 이상인 구간만 본다. 그러고 나니 **위반 0건 — 설계가 맞았다.**
    #
    # ★우리는 차압계를 통째로 못 보고 있었다.
    #   참고도면은 같은 평면도에 겹을 얹은 **시트 6장**인데 시트 2(차압흐름도)만 잘라 썼다.
    #   차압계는 시트 3에 있다(아날로그 21 · 디지털 7).
    #   scripts/cut_ref_sheet_aligned.py 로 **기준 시트 좌표계로 옮겨** 잘라 온다.
    config:
      enabled: false
      # ★★적용 제형: **무균(별표1)만.** 별표17(완제)에 '차압계' 조문이 **0건**이다.
      applies_to: [sterile]
      grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}
      clean_min_rank: 2              # D 이상을 '청정실'로 본다

  - id: ADJ-001
    severity: critical
    title: "청정등급 급변 인접 (완충 없이 2단계 이상 점프)"
    desc: "에어락·전실 없이 청정등급이 2단계 이상 차이나는 실이 직접 맞닿음"
    clause: "식약처고시 제2024-87호 별표1 제4호 타목 (작업원 동선은 D→C→B 로 **점진적**)
             / 같은 별표1 제4호 타목 (에어락 최종단계는 인접 청정실과 **동일 등급**)
             / 고시 별표17 제3.3호 라목 (시설·설비는 **가급적** 청정도에 따른 타당한 순서로 연결된 구역에 배치)"
    review: unreviewed
    rase:
      requirement: "청정등급은 한 단계씩 점진적으로 변해야 하며, 급변 구간에는 에어락/전실을 둔다"
      applicability: "청정등급이 부여된, 직접 인접한 실 쌍"
      selection: "-"
      exception: "전실(前室)·에어락·패스박스를 경유하는 경우는 직접 인접이 아니다.
                  ※전실은 **높은 쪽 등급**을 따른다(새GMP규정 Q&A 문16 · 별표1 제4호 타목)"
    status: draft
    # ★'금지 등급쌍'은 조문에 없다. 조문에 있는 것은 **점진성(D→C→B)** 이다.
    #   그래서 규칙을 '금지쌍 목록'이 아니라 **'등급 점프 폭'** 으로 다시 정의한다.
    #   (기존 forbidden_pairs 도 남겨 둔다 — 컨설턴트가 특정 조합을 금지하면 그때 채운다.)
    # 게이트: Grade 적재 + 인접 정밀도(폴리곤) + 컨설턴트 검수 후 enabled: true.
    config:
      enabled: false
      # ★적용 제형: 등급 체계(A/B/C/D)는 **별표1(무균)** 것이다. 별표17에 '청정등급' 0건.
      #   별표17 3.3-라("**가급적** 청정도에 따른 타당한 순서")는 **의무가 아니다**('가급적').
      #   → 무균 한정. 완제 시설에서는 **적용 대상 아님**으로 나온다.
      applies_to: [sterile]
      grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}
      max_jump: 1                    # 인접 실 사이 허용 등급 점프(1 = 한 단계씩만)
      airlock_words: [전실, 에어락, "air lock", airlock, 패스박스, "pass box"]
      forbidden_pairs: []            # 조문에 없음. 컨설턴트가 지정하면 채운다.

  - id: ADJ-002
    severity: critical
    title: "갱의실을 우회해 청정실로 들어갈 수 있다"
    desc: "비청정 구역에서 청정실로, 갱의실·에어락을 거치지 않고 갈 수 있는 길이 있음"
    clause: "식약처고시 제2024-87호 별표1 제4호 가목 —
             '이 청정실은 작업원의 경우 **에어락 역할을 하는 갱의실을 통해 이동**해야 하며
              장비와 원자재는 에어락을 통해 이동해야 한다'
             (법제처 HWP · 고시 XML 대조 확인)"
    review: unreviewed
    rase:
      requirement: "비청정 구역에서 청정실로 가려면 **반드시** 갱의실(에어락)을 지나야 한다"
      applicability: "청정등급이 부여되고 **문 인접(동선)** 이 있는 도면"
      selection: "동선 그래프에서 갱의실·에어락 노드를 제거해도 청정실이 비청정 구역과 이어지면 위반"
      exception: "물자 전용 문·패스박스·비상구는 작업원 동선이 아닐 수 있다 → 발주처 확인"
    status: draft
    # ★예전 clause 는 '별표17 / PIC-S Annex 1 - 검수대기' 였다 —
    #   **조문 번호도 원문도 없이 규칙을 만들어 뒀던 것**이다. 법규 코퍼스에서 찾아 채웠다.
    #
    # ★판정 방법이 핵심: "갱의실이 있느냐"가 아니라 **"우회로가 없느냐"** 를 본다.
    #   갱의실을 아무리 잘 갖춰 놔도 옆에 뒷문이 하나 있으면 소용이 없다. 그 뒷문을 찾는다.
    #
    # 전제 둘. 없으면 판정하지 않는다:
    #   ① 문 인접(동선) — 벽 맞댐으로 하면 안 된다. 벽은 지나갈 수 없다
    #   ② 청정등급 — 기준 시설 도면에는 등급 표기가 0건이라 지금은 판정 불가
    config:
      enabled: false
      # ★★적용 제형: **무균(별표1)만.** 조문 첫머리가 "**무균의약품 제조는**…" 으로 시작한다.
      #   적용범위가 문장 안에 박혀 있다. 완제 시설에 들이대면 조문에 없는 의무를 만드는 것이다.
      applies_to: [sterile]
      grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}
      clean_min_rank: 2              # D 이상을 '청정실'로 본다
      # ★패스박스·해치를 넣었다 — 조문 자체가 "장비와 원자재는 에어락을 통해 이동"을 요구한다.
      gowning_words: [갱의, 탈의, 에어락, 에어록, "air lock", airlock, 전실, 샤워,
                      손세정, 손씻, 세면, 에어샤워, 패스박스, "pass box", 해치, hatch]

  - id: ADJ-003
    severity: major
    title: "화장실이 작업소·보관소와 직접 연결됨"
    desc: "화장실이 청정 작업실 또는 보관소와 **문으로 바로** 이어져 있음"
    clause: "식약처고시 제2024-87호 별표17 제3.6호 부대구역 나목 —
             '화장실은 작업소 또는 보관소와 직접 연결되지 아니하여야 한다'
             (법제처 HWP · 고시 XML · 식약처 PDF 세 출처에서 동일 확인)"
    review: unreviewed
    rase:
      requirement: "화장실은 작업소·보관소와 직접 연결되지 않아야 한다"
      applicability: "**문으로 직접 이어진** 실 쌍 (via_door=true). 벽만 맞댄 것은 '연결'이 아니다"
      selection: "한쪽이 화장실이고 다른 쪽이 작업소(등급 부여 또는 분진·특수 공정실) 또는 보관소"
      exception: "복도·전실을 거치면 '직접 연결'이 아니다 → 위반 아님.
                  부대구역(갱의실·샤워실 등)과 붙은 것은 정상이다"
    status: draft
    # ★GMP 조문은 대개 '가급적'·'적절히'로 여지를 남긴다. 이 조문은 다르다 —
    #   '직접 연결되지 아니하여야 한다' 는 **금지**다. 도면만으로 판정 가능한 몇 안 되는 조문.
    # ★문 인접(동선 그래프)이 생기기 전에는 만들 수 없던 규칙이다.
    #   문 데이터를 못 믿는 도면에서는 **아무것도 판정하지 않는다**(벽 인접으로 대신하면 거짓 위반).
    config:
      enabled: false
      # ★★**별표17(완제) 조문이다.** 우리 기준 시설에 정확히 맞는 몇 안 되는 규칙.
      applies_to: [finished, sterile, api]

  - id: ADJ-004
    severity: major
    title: "휴게실·식당이 다른 구역과 분리되지 않음"
    desc: "휴게실·식당이 작업소 또는 보관소와 **문으로 바로** 이어져 있음"
    clause: "식약처고시 제2024-87호 별표17 제3.6호 부대구역 가목 —
             '휴게실과 식당은 다른 구역과 분리되어 있어야 한다'
             / 2010 시설기준 안내서 p.25 — **분리** = 별개 건물 권장 + 전용 출입구 + **별도 공조**
               (벽·칸막이로 나누는 '구획'보다 강한 요구다)"
    review: unreviewed
    rase:
      requirement: "휴게실·식당은 다른 구역과 **분리**되어야 한다"
      applicability: "**문으로 직접 이어진** 실 쌍 (via_door=true)"
      selection: "한쪽이 휴게실·식당이고 다른 쪽이 작업소 또는 보관소"
      exception: "휴게실↔식당, 휴게실↔화장실은 문제가 아니다. 복도를 거치면 '직접'이 아니다"
    status: draft
    # ★★한계를 반드시 읽을 것: **'분리 아님'은 증명할 수 있어도 '분리 맞음'은 증명할 수 없다.**
    #   조문의 '분리'는 **별도 공조**까지 요구한다. 우리는 도면에서 '문으로 이어짐'만 본다.
    #   → 위반 0건이어도 "분리 확인됨"이 아니라 **"직접 연결 없음"** 이라고 써야 한다.
    #
    # 현재 데이터: 기준 시설 휴게실 2개(4111·4112)가 **차압도에만 있고 평면도에 없다**
    #   → 좌표가 없어 판정 불가(LBL-002 로 이미 보고 중). 평면도에 그려진 도면이 오면 켜진다.
    #   로직은 합성 데이터로 완성해 두었다(tests/test_annex_rules.py).
    config:
      enabled: false
      # ★★**별표17(완제) 조문이다.** 우리 기준 시설에 맞는다.
      applies_to: [finished, sterile, api]

  - id: ADJ-005
    severity: critical
    title: "A·B 등급으로 연결되는 에어락에 인터락이 없다"
    desc: "에어락의 두 문이 동시에 열리면 청정실이 비청정 구역에 그대로 뚫린다"
    clause: "식약처고시 제2024-87호 별표1 제4호 파목 —
             '이송해치 및 에어락(물품 및 작업원용)의 경우 입구용과 출구용 문이 **동시에 열려서는
              안 된다**. **A등급과 B등급 구역으로 연결되는 에어락의 경우 인터락 시스템을 사용해야
              한다.** C등급과 D등급 청정실로 연결되는 에어락의 경우, 최소한 시각경고시스템 …'"
    review: unreviewed
    rase:
      requirement: "A·B 등급 구역으로 연결되는 에어락에는 **인터락 시스템**이 있어야 한다"
      applicability: "이름이 전실·에어락·패스박스·해치이고, **문으로** A 또는 B 등급 실과 이어진 방"
      selection: "-"
      exception: "C·D 등급으로만 연결되는 에어락은 **최소한 시각경고시스템**이면 된다(조문상).
                  인터락 도면이 없는 시설은 판정하지 않는다"
    status: draft
    # ★★현행판과 구판이 **다르다.** 구판을 인용했으면 이 규칙을 못 만들었다.
    #   구판(식약처 게시판·인용금지): "인터락 시스템 **또는** 시각적·청각적 경보장치"
    #   현행(법제처):                A/B 는 **인터락 필수** / C·D 는 시각경고
    #   → 구판을 인용했으면 A/B 의 인터락 의무를 놓쳤을 것이다. **근거가 둘이면 대조한다.**
    #
    # 왜 인터락인가: 경고등은 사람이 무시할 수 있지만 인터락은 물리적으로 막는다.
    #   그래서 가장 깨끗한 A/B 구역에는 경고가 아니라 인터락을 요구한다.
    config:
      enabled: false
      # ★★적용 제형: **무균(별표1)만.** 조문 자체가 "**A등급과 B등급 구역**으로 연결되는
      #   에어락"이라고 한정한다. 내용고형제의 기본 등급은 **D** 다(1차 미팅 대표님).
      #   `interlock_min_rank` 를 낮추면 **조문에 없는 의무를 만들어내는 판정**이 된다.
      #   ⚠ 대표님이 "빨간 선 = 인터락"이라 확인해 준 것은 *도면에 인터락이 그려져 있다*는
      #     사실이지, *법이 D등급에 인터락을 요구한다*는 뜻이 아니다. **섞으면 안 된다.**
      applies_to: [sterile]
      grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}
      interlock_min_rank: 4          # B 이상으로 연결되면 인터락 의무 (조문 그대로)
      airlock_words: [전실, 에어락, 에어록, "air lock", airlock, 패스박스, "pass box", 해치, hatch]

  - id: HVAC-001
    severity: major
    title: "환기 횟수가 자사 기준에 못 미친다"
    desc: "방의 급기 풍량이 자사 기준서의 환기 횟수(회/hr)를 못 채운다"
    clause: "★**법정 수치가 아니다.** 현행 고시(별표1, 2023 개정)에는 환기 횟수 수치가 **없다**
             (구 KGMP 해설서에만 있다 — 별표1의 '환기' 6건 전수 확인, 전부 다른 맥락).
             현행은 오염관리전략(CCS)으로 입증하게 한다.
             → 차압(PRES-002)과 똑같이 **발주처 자사 기준서**로 판정한다.
             1차 미팅(2026-07-09) 대표님: '**제일 중요한 게 환기 횟수**… 1시간에 몇 번
             순환해야 된다는 조건이 꼭 있거든요'"
    review: unreviewed
    rase:
      requirement: "각 방의 환기 횟수는 **자사 기준서**가 정한 값 이상이어야 한다"
      applicability: "등급·급기 풍량·면적이 모두 있고, **천장고와 자사 기준이 주어진** 방"
      selection: "-"
      exception: "천장고나 자사 기준이 없으면 **판정하지 않는다.** 추측해 채우지 않는다"
    status: draft
    # ★★법정 수치(A 600회/hr 등)를 여기 박아 넣지 말 것.
    #   그건 구 KGMP 해설서다. 근거 없는 관행을 법인 것처럼 판정하게 된다.
    #   아래 값은 **발주처가 줘야 하는 칸**이다. 비어 있으면 규칙이 조용히 0건을 낸다.
    config:
      enabled: false
      # ★적용 제형: **무관.** 자사 기준서로 판정하므로 조문 제형과 상관없다.
      applies_to: [any]
      # ceiling_height_m: 2.7        # ← 발주처 확인 필요
      # ach_by_grade: {A: 600, B: 20, C: 10, D: 6}   # ← 발주처 자사 기준서

  - id: LBL-001
    severity: minor
    title: "방번호-이름 라벨 불일치"
