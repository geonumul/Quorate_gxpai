# gmp_osd_v1.yaml - GMP OSD violations 규칙 v1 (T2.3.1)
# 규칙 = 데이터. 코드 배포 없이 규칙 추가 가능.
#
# 근거 추적성(RASE, Hjelseth & Nisbet 2011): 각 규칙을 4연산자로 분해해 "무엇을 왜 검사하는지"를
# 규정 조항까지 역추적할 수 있게 한다. auditability 는 GMP 규제의 핵심 가치(선행연구 공통 결론).
#   requirement  : 만족돼야 하는 것(shall/must)
#   applicability: 적용 대상/조건(범위 좁힘)
#   selection    : 대체 대상(범위 넓힘)
#   exception    : 예외(unless, 배제)
#
# review = 동결 게이트(GEN-R2, 규칙 오류가 생성 보상을 오염시키지 않게):
#   internal   = 내부 정합성 검사(GMP 조항 아님) - 활성 안전, 생성 보상 사용 가능
#   unreviewed = GMP 조항 기반이나 컨설턴트 미검수 - 게이트로 잠금, 생성 보상 사용 금지
#   approved   = 컨설턴트 검수 완료 - 활성/보상 사용 가능
# clause 의 조항번호·잠정 파라미터는 컨설턴트 검수 전까지 확정 아님(보류).
version: "1"
ruleset: gmp_osd_v1

rules:
  # ─────────────────────────────────────────────────────────────────────
  # 압력 규칙 3종 (2026-07-13 전면 재설계)
  #
  # ★압력 방향에는 세 가지 유형이 있고, 하나로 묶으면 안 된다.
  #   ① protect(보호)  실이 고압 — 무균제제·일반 청정실          → PRES-001
  #   ② contain(봉쇄)  실이 저압, 복도가 고압 — 분진 발생 공정   → PRES-003
  #   ③ hazard(특수)   실이 음압 — 페니실린·세포독성            → PRES-003
  #   **우리 기준 시설(내용고형제)은 ②번이다.** ①만 검사하면 전부 거짓 위반이 난다.
  #   근거: 2010 시설기준 안내서 p.24 그림6 · p.60 / 1차 미팅 / 법규/조문근거_색인.md A-4·A-5
  #
  # 화살표 의미(S-1)는 **확정됨**: 화살촉 = 저압 쪽 = 공기가 흘러가는 방향.
  #   ①1차 미팅 ②새 참고도면 범례 ③절대압력(Pa) 대조 ④DXF 회전각(0/90/180/270) — 4중 확인.
  # ─────────────────────────────────────────────────────────────────────

  - id: PRES-001
    severity: critical
    title: "압력 캐스케이드 역전 (보호형 실)"
    desc: "보호형(무균·청정) 실끼리, 더 깨끗한 방이 인접 방보다 저압이면 위반"
    clause: "식약처고시 제2024-87호 별표1 제4호 하목 / 2010 시설기준 안내서 p.23 (Cascade)"
    review: unreviewed
    rase:
      requirement: "보호(protect)형 실 사이에서는 청정도가 높은 방이 더 고압이어야 한다"
      applicability: "차압 관계가 확정되고 **양쪽 모두 protect 형**인 인접 실 쌍"
      selection: "-"
      exception: "봉쇄(contain)·특수(hazard)·중립(neutral) 실이 끼면 제외 → PRES-003 이 본다.
                  옥외·계단실·샤프트 등 압력관리 대상 아닌 공간도 제외"
    status: draft
    # 게이트 사유가 바뀌었다: 화살표 의미는 해결됨.
    # 남은 것 = grade_rank·regime 판정의 **컨설턴트 검수**, 그리고 Grade 데이터 적재.
    config:
      enabled: false
      cleaner_should_be: higher
      grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}   # 클수록 깨끗
      # regime_overrides: {"3117": contain}   # 이름 추론이 틀릴 때 방번호로 덮어쓴다

  - id: PRES-002
    severity: major
    title: "차압 기준값 이탈"
    desc: "인접 실의 차압이 **발주처 사내 기준서** 범위를 벗어남"
    clause: "「의약품 등의 안전에 관한 규칙」[별표1] 2.3 환경관리 나 (설정·유지 의무)
             / 식약처 현장감시 지적사례: '자사 기준서에 정해진 기준에 맞게 유지하지 아니함'"
    review: unreviewed
    rase:
      requirement: "차압은 **발주처가 정한 사내 기준서 범위** 안에 있어야 한다"
      applicability: "청정등급이 부여되고 절대압력(Pa)이 표기된 인접 실 쌍"
      selection: "기준서가 아예 없으면 '차압 기준 미설정' 자체가 위반"
      exception: "압력관리 대상이 아닌 공간(보관소·기계실 등)은 제외"
    status: draft
    # ★법정 수치로 판정하지 않는다. 실사관은 '자사 기준을 지켰나'를 본다.
    #   "10Pa 미만이니 위반"은 법적으로 틀린 판정이다.
    #   아래 값은 **새 참고도면 범례에서 읽은 그 시설의 사내 기준**이다(발주처 확인 필요).
    #   ⚠ 10~15Pa 은 2018년판까지의 국제 문구다. 2023년 개정에서 상한 15 가 삭제됐다.
    config:
      enabled: false
      diff_grade_pa: [10, 15]      # 등급이 다를 때 허용 차압 (사내 기준). **폴백용**
      same_grade_pa: [5, 10]       # 등급이 같을 때 (사내 기준). **폴백용**
      statutory_min_pa: 10         # 고시 별표1 참고치 — 미달 시 '경고'(위반 아님)
      # ★도면이 구간별 목표 차압을 직접 적어두면(화살표 레이어 'Air Flow 15Pa') **그것이 기준**이다.
      #   위 등급별 범위는 도면에 설정값이 없을 때만 쓰는 폴백이다.
      #   설계사가 지정한 값 = 사실상의 자사 기준. 짐작보다 도면이 우선한다.
      setpoint_tolerance_pa: 5     # 도면 설정값 대비 허용오차(Pa). 표기·반올림 관행 흡수

  - id: PRES-003
    severity: critical
    title: "봉쇄 실패 (분진·특수제제 실이 복도보다 고압)"
    desc: "분진 발생실·특수제제실이 인접 복도보다 고압이면 분진이 복도로 확산됨"
    clause: "2010 의약품제조소 시설기준 안내서 p.24 그림6 (통로 30Pa > 작업실 15Pa)
             / 같은 안내서 p.60 (시설기준령 시행규칙 제5조 해설: 분진이 외부로 빠져나가지 않도록)
             / 같은 안내서 p.33 (분진 발생 작업실에는 국소집진시설)"
    review: unreviewed
    rase:
      requirement: "분진 발생실·특수제제실은 인접 복도보다 **저압**이어야 한다(봉쇄)"
      applicability: "regime 이 contain 또는 hazard 인 실과, 그에 인접한 복도"
      selection: "화살표(작업실→복도) 또는 절대압력(실 Pa > 복도 Pa) 중 하나만 걸려도 보고"
      exception: "폐쇄식 설비(isolator 등)로 오염 우려가 없는 경우
                  (2010 안내서 p.21 — 이때는 구획·차압 요구가 완화된다)"
    status: draft
    # ★우리 기준 시설(내용고형제)에 실제로 적용되는 압력 규칙이 이것이다.
    config:
      enabled: false
      # regime_overrides: {"3117": contain}

  - id: PRES-004
    severity: major
    title: "도면 내부 모순 (화살표 방향 ↔ 절대압력)"
    desc: "차압 화살표는 A→B 로 공기가 흐른다는데, 적힌 압력은 A < B 다. 공기는 낮은 데로만 흐른다"
    clause: "법 위반이 아니라 **도면 품질** 문제다. 다만 차압 설정·유지·기록 의무
             (「의약품 등의 안전에 관한 규칙」 별표1 2.3 환경관리 나)와 이어질 수 있다 — 해석 보류"
    review: unreviewed
    rase:
      requirement: "도면의 두 근거(화살표 방향 / 절대압력 수치)는 서로 일치해야 한다"
      applicability: "방 귀속이 확정되고 **양쪽 모두 절대압력이 표기된** 차압 화살표"
      selection: "꼬리쪽 Pa < 화살촉쪽 Pa 이면 모순"
      exception: "동압(Δ0Pa)은 판단 불가 — 보고하지 않는다"
    status: draft
    # ★이 규칙은 **엔진의 자기 점검**을 겸한다.
    #   참고도면 2층에서 처음 돌렸을 때 화살표 28개 중 9개가 모순이었는데 **전부 우리 버그**였다
    #   (블록별 화살촉 방향 가정 오류 5 + 방 귀속 시 측면거리 무시 4). 고치니 31개 중 1개만 남았다.
    #   → 모순이 갑자기 늘면 도면을 의심하기 전에 **우리 추출부터 의심하라.**
    config:
      enabled: false

  - id: ADJ-001
    severity: critical
    title: "청정등급 급변 인접 (완충 없이 2단계 이상 점프)"
    desc: "에어락·전실 없이 청정등급이 2단계 이상 차이나는 실이 직접 맞닿음"
    clause: "식약처고시 제2024-87호 별표1 제4호 타목 (작업원 동선은 D→C→B 로 **점진적**)
             / 같은 별표1 제4호 타목 (에어락 최종단계는 인접 청정실과 **동일 등급**)
             / 고시 별표17 제3.3호 라목 (시설·설비는 **가급적** 청정도에 따른 타당한 순서로 연결된 구역에 배치)"
    review: unreviewed
    rase:
      requirement: "청정등급은 한 단계씩 점진적으로 변해야 하며, 급변 구간에는 에어락/전실을 둔다"
      applicability: "청정등급이 부여된, 직접 인접한 실 쌍"
      selection: "-"
      exception: "전실(前室)·에어락·패스박스를 경유하는 경우는 직접 인접이 아니다.
                  ※전실은 **높은 쪽 등급**을 따른다(새GMP규정 Q&A 문16 · 별표1 제4호 타목)"
    status: draft
    # ★'금지 등급쌍'은 조문에 없다. 조문에 있는 것은 **점진성(D→C→B)** 이다.
    #   그래서 규칙을 '금지쌍 목록'이 아니라 **'등급 점프 폭'** 으로 다시 정의한다.
    #   (기존 forbidden_pairs 도 남겨 둔다 — 컨설턴트가 특정 조합을 금지하면 그때 채운다.)
    # 게이트: Grade 적재 + 인접 정밀도(폴리곤) + 컨설턴트 검수 후 enabled: true.
    config:
      enabled: false
      grade_rank: {A: 5, B: 4, C: 3, D: 2, CNC: 1, NC: 0}
      max_jump: 1                    # 인접 실 사이 허용 등급 점프(1 = 한 단계씩만)
      airlock_words: [전실, 에어락, "air lock", airlock, 패스박스, "pass box"]
      forbidden_pairs: []            # 조문에 없음. 컨설턴트가 지정하면 채운다.

  - id: ADJ-002
    severity: major
    title: "갱의 체인 누락"
    desc: "청정구역 진입 경로에 규정 갱의실 시퀀스 부재"
    clause: "별표17 / PIC-S Annex 1 - 검수대기"
    review: unreviewed
    rase:
      requirement: "청정구역 진입 경로에는 규정된 갱의실 시퀀스가 있어야 한다"
      applicability: "저청정→고청정 구역으로 진입하는 동선 경로"
      selection: "-"
      exception: "물자 전용 경로(패스박스 등)는 별도 규정 적용"
    status: draft
    # 미구현: Grade 도면 + 경로/인접 정밀도(폴리곤) 필요.

  - id: LBL-001
    severity: minor
    title: "방번호-이름 라벨 불일치"
    desc: "평면도와 차압도의 동일 방번호 이름이 상이 (v0.1에서 4건 검출)"
    clause: "내부 정합성(평면도-차압도 대조) - GMP 조항 아님"
    review: internal
    rase:
      requirement: "같은 방번호는 평면도와 차압도에서 이름이 일치해야 한다"
      applicability: "평면도·차압도 두 도면 모두에 존재하는 번호방"
      selection: "-"
      exception: "표기 차이(공백·괄호·N·하이픈)만 있는 경우는 제외(정규화 후 비교)"
    status: active

  - id: LBL-002
    severity: minor
    title: "방번호 누락/중복"
    desc: "라벨은 있으나 번호 미부여, 또는 도면 간 한쪽에만 존재"
    clause: "내부 정합성(도면 간 방 대조) - GMP 조항 아님"
    review: internal
    rase:
      requirement: "번호방은 평면도와 차압도 양쪽에 일관되게 존재해야 한다"
      applicability: "번호가 부여된 방"
      selection: "-"
      exception: "-"
    status: draft
