  - id: LBL-003
    severity: minor
    title: "같은 방번호가 서로 다른 두 방에 붙어 있다"
    desc: "한 도면 안에서 같은 방번호가 멀리 떨어진 두 방에 표기됨.
           우리 병합은 한쪽을 버리므로 그 방은 **아무 검사도 받지 못한다**"
    # ★방번호 충돌 감지기를 만들자마자 기준 시설에서 **2건**이 나왔다.
    #   그 전까지 `_merge` 가 조용히 덮어썼다 — 방이 사라지는데 로그 한 줄 없었다.
    #
    #       3203  '샤워실(남)A'  ↔ '샤워실(남)A'      8,896mm 떨어짐
    #       4504  '(N)타정4실'   ↔ '(N)타정2실 전실'  6,025mm 떨어짐
    #
